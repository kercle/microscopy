[package]
name = "interface"
version = "0.1.0"
edition = "2024"

[lib]
name = "interface"
path = "src/lib.rs"

[[bin]]
name = "com-client"
path = "src/uart/cli.rs"
required-features = ["host", "cli"]

[features]
default = ["cli", "host"]
cli = ["clap", "ratatui", "tokio", "tokio-util"]
host = ["anyhow", "std", "regex", "serialport", "ts-rs", "serde_with"]
std = []

[dependencies]
cobs = { version = "0.4.0", default-features = false, features = ["alloc"] }
postcard = "1.1.3"
serde = { version = "1.0.226", features = [
    "derive",
    "alloc",
], default-features = false }
anyhow = { version = "1.0.100", optional = true }
clap = { version = "4.5.48", features = ["derive"], optional = true }
ratatui = { version = "0.29.0", optional = true }
regex = { version = "1.11.2", optional = true }
tokio = { version = "1.47.1", optional = true, features = ["full"] }
tokio-util = { version = "0.7.16", optional = true }
serialport = { version = "4.7.3", optional = true }
ts-rs = { version = "11.1.0", optional = true }
serde_with = { version = "3.15.1", optional = true }
