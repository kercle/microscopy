[package]
name = "communication"
version = "0.1.0"
edition = "2024"

[lib]
name = "communication"
path = "src/lib.rs"

[[example]]
name = "com-client"
path = "src/client.rs"

[dev-dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
ratatui = "0.29.0"
tokio = "1.47.1"


[dependencies]
cobs = { version = "0.4.0", default-features = false, features = ["alloc"] }
postcard = "1.1.3"
serde = { version = "1.0.226", features = ["derive"], default-features = false }
