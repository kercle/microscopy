[package]
name = "control-app"
version = "0.1.0"
edition = "2024"

[dependencies]
communication = { path = "../communication", features = ["host"] }
anyhow = "1.0.99"
axum = { version = "0.8.4", features = ["multipart", "ws", "query"] }
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
gstreamer = "0.24.1"
gstreamer-app = "0.24.0"
gstreamer-video = "0.24.1"
http = "1.3.1"
mime_guess = "2.0.5"
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path"] }
self-replace = "1.5.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_with = "3.14.0"
tempfile = "3.22.0"
tokio = { version = "1.47.1", features = [
    "rt-multi-thread",
    "macros",
    "bytes",
] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.16", features = ["io"] }
tower-http = { version = "0.6.6", features = ["compression-full"] }
tracing = "0.1.41"
tracing-gstreamer = "0.9.0"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
turbojpeg = "1.3.3"
clap = { version = "4.5.51", features = ["derive"] }
uuid = { version = "1.18.1", features = ["v4"] }
