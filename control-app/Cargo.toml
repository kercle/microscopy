[package]
name = "control-app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
axum = "0.8.4"
bytes = "1.10.1"
gstreamer = "0.24.1"
gstreamer-app = "0.24.0"
gstreamer-video = "0.24.1"
http = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = [
    "rt-multi-thread",
    "macros",
    "bytes",
] }
tokio-stream = "0.1.17"
turbojpeg = "1.3.3"
